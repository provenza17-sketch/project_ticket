<!-- ============================================
     TICKET MANAGEMENT SECTION
     ============================================ -->
<section id="tickets" style="max-width:1400px;margin:0 auto;padding:0 2rem 4rem;">

  <!-- Header -->
  <div class="tickets-header">
    <div class="tickets-title-group">
      <h2 class="section-title" style="margin-bottom:0;">
        <i class="fas fa-ticket-alt"></i> Ticket Management
      </h2>
      <span class="ticket-count-badge" id="ticketOpenBadge">0 aperti</span>
    </div>
    <button class="btn-add-prospect" onclick="openTicketModal()">
      <i class="fas fa-plus"></i> Nuovo Ticket
    </button>
  </div>

  <!-- Stats -->
  <div class="ticket-stats">
    <div class="ticket-stat-card">
      <div class="ticket-stat-icon"><i class="fas fa-layer-group"></i></div>
      <div class="ticket-stat-info">
        <div class="stat-num" id="tStatTotal">0</div>
        <div class="stat-lbl">Totale Ticket</div>
      </div>
    </div>
    <div class="ticket-stat-card">
      <div class="ticket-stat-icon"><i class="fas fa-folder-open"></i></div>
      <div class="ticket-stat-info">
        <div class="stat-num" id="tStatOpen">0</div>
        <div class="stat-lbl">Aperti</div>
      </div>
    </div>
    <div class="ticket-stat-card">
      <div class="ticket-stat-icon"><i class="fas fa-clock"></i></div>
      <div class="ticket-stat-info">
        <div class="stat-num" id="tStatDueToday">0</div>
        <div class="stat-lbl">In Scadenza Oggi</div>
      </div>
    </div>
    <div class="ticket-stat-card">
      <div class="ticket-stat-icon"><i class="fas fa-check-double"></i></div>
      <div class="ticket-stat-info">
        <div class="stat-num" id="tStatDone">0</div>
        <div class="stat-lbl">Completati</div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="ticket-controls">
    <div class="ticket-search">
      <i class="fas fa-search"></i>
      <input type="text" id="ticketSearchInput"
             placeholder="Cerca ticket per titolo o assegnato..."
             oninput="filterTickets()">
    </div>
    <select class="ticket-filter-select" id="ticketFilterStatus" onchange="filterTickets()">
      <option value="all">Tutti gli stati</option>
      <option value="todo">Da Fare</option>
      <option value="in-progress">In Corso</option>
      <option value="review">In Review</option>
      <option value="done">Completato</option>
    </select>
    <select class="ticket-filter-select" id="ticketFilterPriority" onchange="filterTickets()">
      <option value="all">Tutte le priorità</option>
      <option value="high">🔴 Alta</option>
      <option value="medium">🟡 Media</option>
      <option value="low">🟢 Bassa</option>
    </select>
    <select class="ticket-filter-select" id="ticketFilterAssignee" onchange="filterTickets()">
      <option value="all">Tutti gli assegnati</option>
    </select>

    <!-- View toggle -->
    <div class="view-toggle">
      <button class="active" id="tViewGrid" onclick="setTicketView('grid', this)" title="Vista Kanban">
        <i class="fas fa-columns"></i>
      </button>
      <button id="tViewList" onclick="setTicketView('list', this)" title="Vista Lista">
        <i class="fas fa-list"></i>
      </button>
    </div>
  </div>

  <!-- Board Wrapper -->
  <div class="kanban-board-wrapper" id="kanbanWrapper">

    <!-- Kanban Board -->
    <div class="kanban-board" id="kanbanBoard">

      <!-- Col: Da Fare -->
      <div class="kanban-col col-todo"
           data-status="todo"
           ondragover="onDragOver(event)"
           ondrop="onDrop(event, 'todo')"
           ondragleave="onDragLeave(event)">
        <div class="kanban-col-header">
          <div class="kanban-col-title">
            <div class="kanban-dot"></div>
            Da Fare
          </div>
          <span class="kanban-count" id="colCount-todo">0</span>
          <button class="kanban-add-btn" onclick="openTicketModal('todo')" title="Aggiungi ticket">
            <i class="fas fa-plus"></i>
          </button>
        </div>
        <div class="kanban-cards" id="col-todo"></div>
      </div>

      <!-- Col: In Corso -->
      <div class="kanban-col col-progress"
           data-status="in-progress"
           ondragover="onDragOver(event)"
           ondrop="onDrop(event, 'in-progress')"
           ondragleave="onDragLeave(event)">
        <div class="kanban-col-header">
          <div class="kanban-col-title">
            <div class="kanban-dot"></div>
            In Corso
          </div>
          <span class="kanban-count" id="colCount-in-progress">0</span>
          <button class="kanban-add-btn" onclick="openTicketModal('in-progress')" title="Aggiungi ticket">
            <i class="fas fa-plus"></i>
          </button>
        </div>
        <div class="kanban-cards" id="col-in-progress"></div>
      </div>

      <!-- Col: In Review -->
      <div class="kanban-col col-review"
           data-status="review"
           ondragover="onDragOver(event)"
           ondrop="onDrop(event, 'review')"
           ondragleave="onDragLeave(event)">
        <div class="kanban-col-header">
          <div class="kanban-col-title">
            <div class="kanban-dot"></div>
            In Review
          </div>
          <span class="kanban-count" id="colCount-review">0</span>
          <button class="kanban-add-btn" onclick="openTicketModal('review')" title="Aggiungi ticket">
            <i class="fas fa-plus"></i>
          </button>
        </div>
        <div class="kanban-cards" id="col-review"></div>
      </div>

      <!-- Col: Completato -->
      <div class="kanban-col col-done"
           data-status="done"
           ondragover="onDragOver(event)"
           ondrop="onDrop(event, 'done')"
           ondragleave="onDragLeave(event)">
        <div class="kanban-col-header">
          <div class="kanban-col-title">
            <div class="kanban-dot"></div>
            Completato
          </div>
          <span class="kanban-count" id="colCount-done">0</span>
          <button class="kanban-add-btn" onclick="openTicketModal('done')" title="Aggiungi ticket">
            <i class="fas fa-plus"></i>
          </button>
        </div>
        <div class="kanban-cards" id="col-done"></div>
      </div>

    </div><!-- /kanban-board -->

    <!-- List View -->
    <div class="ticket-list-view" id="ticketListView">
      <table class="ticket-table">
        <thead>
          <tr>
            <th>Titolo</th>
            <th>Stato</th>
            <th>Priorità</th>
            <th>Assegnato</th>
            <th>Prospect</th>
            <th>Scadenza</th>
            <th>Subtask</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody id="ticketTableBody"></tbody>
      </table>
    </div>

  </div><!-- /kanban-board-wrapper -->

</section>

<!-- ============================================
     TICKET MODAL
     ============================================ -->
<div class="modal-overlay" id="ticketModalOverlay" onclick="closeTicketModal(event)">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:680px;">
    <h2><i class="fas fa-ticket-alt"></i> <span id="ticketModalTitle">Nuovo Ticket</span></h2>
    <form id="ticketForm" onsubmit="submitTicket(event)">
      <input type="hidden" id="tFormId">
      <input type="hidden" id="tFormStatus" value="todo">

      <div class="form-group">
        <label>Titolo *</label>
        <input type="text" id="tFormTitle" required placeholder="es. Creare landing page estiva">
      </div>

      <div class="form-group">
        <label>Descrizione</label>
        <textarea id="tFormDescription" rows="3" placeholder="Dettagli del ticket..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Stato</label>
          <select id="tFormStatusSelect">
            <option value="todo">Da Fare</option>
            <option value="in-progress">In Corso</option>
            <option value="review">In Review</option>
            <option value="done">Completato</option>
          </select>
        </div>
        <div class="form-group">
          <label>Priorità</label>
          <select id="tFormPriority">
            <option value="high">🔴 Alta</option>
            <option value="medium">🟡 Media</option>
            <option value="low">🟢 Bassa</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Tag / Etichetta</label>
          <select id="tFormTag">
            <option value="Feature">Feature</option>
            <option value="Bug">Bug</option>
            <option value="Design">Design</option>
            <option value="Marketing">Marketing</option>
            <option value="Altro">Altro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Assegnato a</label>
          <input type="text" id="tFormAssignee" placeholder="es. Mario R.">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Prospect Collegato</label>
          <select id="tFormProspect">
            <option value="">Nessuno</option>
          </select>
        </div>
        <div class="form-group">
          <label>Data Scadenza</label>
          <input type="date" id="tFormDueDate">
        </div>
      </div>

      <div class="form-group">
        <label>Subtask</label>
        <div class="subtask-list" id="subtaskList"></div>
        <button type="button" class="btn-add-subtask" onclick="addSubtaskField()">
          <i class="fas fa-plus"></i> Aggiungi Subtask
        </button>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeTicketModal()">Annulla</button>
        <button type="submit" class="btn-save">
          <i class="fas fa-check"></i> Salva Ticket
        </button>
      </div>
    </form>
  </div>
</div>
